<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AuraLingo 技术支持</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
      padding: 24px;
      max-width: 760px;
      margin: auto;
      color: #141414;
      background: #ffffff;
    }
    h1, h2 { color: #1c6f55; }
    p, li { font-size: 15px; }
    a { color: #1c6f55; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .card {
      background: #f2f5f3;
      border: 1px solid #e3e8e5;
      border-radius: 12px;
      padding: 16px 18px;
      margin: 16px 0;
    }
  </style>
</head>
<body>
  <h1>AuraLingo 技术支持</h1>
  <p>如需帮助或有任何问题，请联系：<a href="mailto:yaogdu@gmail.com">yaogdu@gmail.com</a>。</p>

  <div class="card">
    <h2>常见问题</h2>
    <ul>
      <li><strong>恢复购买：</strong>设置 → Pro 会员 → 恢复购买。</li>
      <li><strong>iCloud 同步：</strong>请在系统设置中确保 AuraLingo 的 iCloud 已开启。</li>
      <li><strong>词库进度：</strong>学习后会更新进度，开启 iCloud 后可同步到多设备。</li>
    </ul>
  </div>

  <div class="card">
    <h2>问题排查</h2>
    <ul>
      <li>更新到最新版本。</li>
      <li>若同步异常，可尝试关闭并重新开启 iCloud 同步。</li>
      <li>问题仍存在，请邮件说明设备型号与系统版本。</li>
    </ul>
  </div>
</body>
</html>
